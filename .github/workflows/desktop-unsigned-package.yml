name: Desktop unsigned packages

# Build the unsigned Desktop installers this fork can produce without Apple
# Developer ID or Windows EV signing credentials: a Windows x64 NSIS EXE and an
# Intel (x86_64) macOS DMG. This workflow is the reusable entry point the
# scheduled sync-upstream workflow calls after it merges upstream commits, and it
# can also be dispatched by hand from Actions.
#
# Unsigned artifacts carry no automatic-update feed and cannot be uploaded to the
# upstream update service; they are for local installation and testing. The
# release job attaches them to a GitHub Release so they stay downloadable, and
# every artifact records the commit it was built from.
#
# Windows requires a mandatory-update policy origin even when unsigned. The
# default is the documented production origin; a repository owner can retarget it
# with the DSH_DESKTOP_POLICY_ORIGIN repository variable.
#
# The Intel macOS image (macos-15-intel) is the last x86_64 runner GitHub Actions
# offers and is scheduled to close in August 2027; the mac-x64 command also runs
# on Apple Silicon under Rosetta if that becomes necessary.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or branch to package; empty packages the calling run commit.
        type: string
        required: false
        default: ''
      release_tag:
        description: GitHub Release tag to create or update; empty skips the release.
        type: string
        required: false
        default: desktop-latest
      policy_origin:
        description: Required HTTPS mandatory-update policy origin for the Windows target.
        type: string
        required: false
        default: https://download.deepseek.com
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or branch to package; empty packages this run's commit.
        type: string
        required: false
        default: ''
      release_tag:
        description: GitHub Release tag to create or update; empty skips the release.
        type: string
        required: false
        default: desktop-latest
      policy_origin:
        description: Required HTTPS mandatory-update policy origin for the Windows target.
        type: string
        required: false
        default: https://download.deepseek.com

permissions:
  contents: read

concurrency:
  # Serialize every unsigned packaging run so two heavy builds cannot race the
  # shared release tag.
  group: desktop-unsigned-package
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-x64:
    name: Windows x64 (unsigned)
    # Override with DSH_DESKTOP_PACKAGE_WINDOWS_RUNNER for a larger or self-hosted runner.
    runs-on: ${{ vars.DSH_DESKTOP_PACKAGE_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Resolve product version
        id: product
        run: |
          $version = (Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare public packaging settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ steps.product.outputs.version }}
          PACKAGE_DEPLOYMENT: production
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --check --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Build unsigned installer
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-win-x64-packaging-logs
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-win-x64-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated package settings
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }

  macos-x64:
    name: macOS Intel x64 (unsigned)
    # Override with DSH_DESKTOP_PACKAGE_MACOS_RUNNER; an Apple Silicon runner builds
    # this target through Rosetta when the Intel image is unavailable.
    runs-on: ${{ vars.DSH_DESKTOP_PACKAGE_MACOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:mac:x64:unsigned --check
      - name: Build unsigned DMG
        run: pnpm run package:desktop:mac:x64:unsigned
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-mac-x64-packaging-logs
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-mac-x64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows-x64, macos-x64]
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*-unsigned
          path: desktop-artifacts
          merge-multiple: true
      - name: Checksum the installers
        working-directory: desktop-artifacts
        run: |
          rm -f SHA256SUMS
          for file in *.exe *.dmg; do
            [ -e "$file" ] || continue
            sha256sum "$file"
          done > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          notes=$(printf 'Unsigned DeepSeek Harness Desktop builds packaged from %s.\n\nProduced by %s\n' "$SOURCE_REF" "$RUN_URL")
          title='DeepSeek Harness Desktop (unsigned)'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" desktop-artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" desktop-artifacts/* \
              --target "$SOURCE_REF" --prerelease --title "$title" --notes "$notes"
          fi
